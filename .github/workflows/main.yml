name: Smart Travel Assistant CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test AI Coursework Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Project Structure
        run: ls -R

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade Pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install notebook jupyter numpy pandas matplotlib
          fi

      - name: Check Python Files Syntax
        run: |
          if [ -d src ]; then
            python -m compileall src
          else
            echo "No src folder found, skipping Python syntax check."
          fi

      - name: Check Jupyter Notebook Exists
        run: |
          if [ -d notebooks ]; then
            echo "Notebook folder found."
            ls notebooks
          else
            echo "No notebooks folder found."
          fi

      - name: Validate Project Files
        run: |
          test -f README.md
          test -f requirements.txt
          echo "README.md and requirements.txt found successfully."

      - name: CI Completed Successfully
        run: echo "Smart Travel Assistant CI Pipeline completed successfully."
